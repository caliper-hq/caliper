services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: caliper, POSTGRES_USER: caliper, POSTGRES_PASSWORD: caliper }
    volumes: ["caliper-postgres:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U caliper -d caliper"], interval: 5s, timeout: 5s, retries: 10 }
  api:
    build: ./api
    ports: ["3000:3000"]
    environment:
      DATABASE_URL: postgres://caliper:caliper@db:5432/caliper
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      BOOTSTRAP_PROJECT_ID: ${BOOTSTRAP_PROJECT_ID:-default}
      BOOTSTRAP_PROJECT_API_KEY: ${BOOTSTRAP_PROJECT_API_KEY:-change-me}
    depends_on: { db: { condition: service_healthy } }
  dashboard:
    build: ./dashboard
    ports: ["3001:3001"]
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3000
      NEXT_PUBLIC_CONTROL_PLANE_URL: http://localhost:3000
    depends_on: [api]
volumes:
  caliper-postgres:

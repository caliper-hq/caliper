name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build Multi-Platform Binaries & Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build binaries for Linux, macOS, and Windows
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -o dist/caliper-linux-amd64 ./cmd/caliper
          GOOS=linux GOARCH=arm64 go build -o dist/caliper-linux-arm64 ./cmd/caliper
          GOOS=darwin GOARCH=amd64 go build -o dist/caliper-darwin-amd64 ./cmd/caliper
          GOOS=darwin GOARCH=arm64 go build -o dist/caliper-darwin-arm64 ./cmd/caliper
          GOOS=windows GOARCH=amd64 go build -o dist/caliper-windows-amd64.exe ./cmd/caliper
          GOOS=windows GOARCH=arm64 go build -o dist/caliper-windows-arm64.exe ./cmd/caliper

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
